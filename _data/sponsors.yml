# # Sponsor / supporter logos rendered in the band above the site footer.
# #
# # Files live in images/sponsors/ and have been trimmed to their ink bounds, so
# # `w`/`h` are the real logo dimensions (used to reserve space and avoid layout
# # shift) and `height` is the rendered optical height in px.
# #
# # `height` is deliberately NOT uniform. These logos range from a 6.2:1 wordmark
# # (Allegheny County) to a 1.3:1 stacked mark (NVIDIA); giving them all the same
# # height would make the wide ones dominate. Each height is set so the logos
# # occupy roughly equal visual area. If you add a logo, pick its height with
# # height ~= sqrt(3000 / aspect_ratio), then eyeball it.
# #
# # `url` is optional and blank by default -- add the correct destination and the
# # logo automatically becomes a link. Left empty because e.g. "google" could mean
# # Google Research or Google.org, which are different funders.


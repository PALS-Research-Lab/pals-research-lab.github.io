<!-- viewBox starts at -2, not 0: the left ear rect sits at x="0" with a 2.5
     stroke, so half that stroke fell outside a 0-origin viewBox and was clipped
     to a flat edge. Geometry is otherwise exactly as designed. -->
<svg xmlns="http://www.w3.org/2000/svg" width="130" height="96" viewBox="-2 0 130 96"
     fill="none" stroke-linecap="round" stroke-linejoin="round" role="img"
     aria-label="An agent system exchanging information with a clinician">
  <!-- antenna -->
  <path d="M27 25 V17" stroke="#12357E" stroke-width="2.5" />
  <circle cx="27" cy="14" r="3.5" fill="#FFD21E" stroke="#12357E" stroke-width="2" />
  <!-- head, ears and neck -->
  <rect x="6" y="25" width="42" height="38" rx="11" stroke="#12357E" stroke-width="2.5" />
  <rect x="0" y="36" width="6" height="15" rx="3" stroke="#12357E" stroke-width="2.5" />
  <rect x="48" y="36" width="6" height="15" rx="3" stroke="#12357E" stroke-width="2.5" />
  <path d="M21 71 H33" stroke="#12357E" stroke-width="2.5" />
  <path d="M22 63 V71 M32 63 V71" stroke="#12357E" stroke-width="2.5" />
  <!-- multi-agent graph inside the head -->
  <path d="M15 34 L27 44 M39 39 L27 44 M16 52 L27 44 M38 53 L27 44 M27 31 L27 44"
        stroke="#12357E" stroke-width="2" />
  <circle cx="15" cy="34" r="2.6" fill="#12357E" />
  <circle cx="27" cy="31" r="2.6" fill="#12357E" />
  <circle cx="39" cy="39" r="2.6" fill="#12357E" />
  <circle cx="16" cy="52" r="2.6" fill="#12357E" />
  <circle cx="38" cy="53" r="2.6" fill="#12357E" />
  <circle cx="27" cy="44" r="4.5" fill="#FFD21E" stroke="#12357E" stroke-width="2.5" />
  <!-- two-way exchange -->
  <path d="M60 38 H68 M64.5 33.5 L69 38 L64.5 42.5" stroke="#FFD21E" stroke-width="2.5" />
  <path d="M68 52 H60 M63.5 47.5 L59 52 L63.5 56.5" stroke="#FFD21E" stroke-width="2.5" />
  <!-- clinician -->
  <circle cx="101" cy="32" r="14" stroke="#12357E" stroke-width="2.5" />
  <path d="M96 45 V51 M106 45 V51" stroke="#12357E" stroke-width="2.5" />
  <path d="M86 80 C86 61 92 51 101 51 C110 51 116 61 116 80" stroke="#12357E" stroke-width="2.5" />
</svg>

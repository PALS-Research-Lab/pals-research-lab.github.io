<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"
     fill="none" stroke-linecap="round" stroke-linejoin="round" role="img"
     aria-label="A cohort split into treatment and control arms for comparison">
  <!-- source cohort splitting into two arms -->
  <circle cx="14" cy="48" r="5" fill="#12357E" />
  <path d="M20 48 C31 48 31 27 42 27" stroke="#12357E" stroke-width="2.5" />
  <path d="M20 48 C31 48 31 69 42 69" stroke="#12357E" stroke-width="2.5" stroke-dasharray="5 5" />
  <!-- treatment arm, with the measured effect highlighted -->
  <rect x="42" y="14" width="40" height="27" rx="6" stroke="#12357E" stroke-width="2.5" />
  <rect x="50" y="29" width="5" height="8" rx="1.5" fill="#12357E" />
  <rect x="59" y="24" width="5" height="13" rx="1.5" fill="#12357E" />
  <rect x="68" y="19" width="5" height="18" rx="1.5" fill="#FFD21E" stroke="#12357E" stroke-width="1.5" />
  <!-- control arm -->
  <rect x="42" y="56" width="40" height="27" rx="6" stroke="#12357E" stroke-width="2.5" />
  <rect x="50" y="70" width="5" height="9" rx="1.5" fill="#C7D2E6" />
  <rect x="59" y="70" width="5" height="9" rx="1.5" fill="#C7D2E6" />
  <rect x="68" y="70" width="5" height="9" rx="1.5" fill="#C7D2E6" />
</svg>
